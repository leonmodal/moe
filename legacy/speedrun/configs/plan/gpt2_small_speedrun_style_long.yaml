# Long-run GPT-2-small baseline for the 3.28 question.
# Uses a real GPT-2 architecture and GPT-2 tokenizer on the local FineWebEdu parquet sample.
experiment_name: gpt2_small_speedrun_style_long

model:
  type: gpt2_dense
  vocab_size: 50257
  hidden_size: 768
  num_hidden_layers: 12
  head_dim: 64
  num_attention_heads: 12
  num_key_value_heads: 12
  intermediate_size: 3072
  max_position_embeddings: 1024
  attention_dropout: 0.0
  resid_pdrop: 0.0
  embd_pdrop: 0.0
  layer_norm_epsilon: 1.0e-5
  tie_word_embeddings: true

training:
  learning_rate: 6.0e-4
  weight_decay: 0.01
  beta1: 0.9
  beta2: 0.95
  max_grad_norm: 1.0
  lr_scheduler: cosine
  warmup_steps: 2000
  max_steps: 40000
  min_lr_ratio: 0.1
  batch_size: 32
  gradient_accumulation: 2
  mixed_precision: bf16
  disable_liger: true
  gradient_checkpointing: false
  log_every: 1
  routing_log_every: 250
  save_every: 1000
  output_dir: ./outputs/plan/gpt2_small_speedrun_style_long
  wandb_project: null
  wandb_run_name: null

data:
  data_dir: ./data/parquet_finewebedu_speedrun
  text_column: text
  seq_len: 1024
  tokenizer_name: gpt2
  num_workers: 4

eval:
  enabled: true
  every: 250
  max_batches: 20
  holdout_fraction: 0.05
  seed: 1234

checkpoint:
  resume_from: null
