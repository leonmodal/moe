# Depth-matched per-head precompute-KV MoE.
# 8 layers, 128 MLP experts (= 8 layers x 16 experts/layer equivalent).
# Attention pool tracks total KV heads: 8 layers x 8 KV heads = 64 experts.
experiment_name: depth_matched_8_layers_moe_everything_per_head_precompute_kv_perlayer_prenorm

model:
  type: moe_everything
  vocab_size: 151936
  hidden_size: 1024
  num_hidden_layers: 8
  head_dim: 128
  num_attention_heads: 16
  num_key_value_heads: 8
  num_experts: 128
  num_experts_per_tok: 4
  moe_intermediate_size: 768
  intermediate_size: 3072
  norm_topk_prob: true
  branch_router_aux_loss_coef: 0.0
  router_aux_loss_coef: 0.0
  seq_aux_loss_coef: 0.0001
  bias_update_rate: 0.001
  bias_interpolation: true
  bias_interpolation_warmup_steps: 5000
  topk_scaling_factor: 2.5
  num_groups: 8
  group_topk: 4
  num_attn_experts: 64
  num_attn_experts_per_tok: 1
  attn_expert_mode: per_head_precompute_kv
  per_head_compute_mode: dense
  use_deepseek_routing: true
  per_layer_router: true
  per_layer_attn_router: true
  global_router_update: true
  per_layer_norm: true
  attention_bias: false
  attention_dropout: 0.0
  rms_norm_eps: 1.0e-6
  rope_theta: 1000000.0
  max_position_embeddings: 32768
  tie_word_embeddings: true
  output_router_logits: true

training:
  learning_rate: 1.0e-3
  weight_decay: 0.01
  beta1: 0.9
  beta2: 0.95
  max_grad_norm: 1.0
  lr_scheduler: cosine
  warmup_steps: 1000
  max_steps: 100000
  min_lr_ratio: 0.1
  batch_size: 32
  gradient_accumulation: 2
  mixed_precision: bf16
  gradient_checkpointing: true
  log_every: 1
  routing_log_every: 50
  save_every: 1000
  output_dir: ./outputs/depth_matched/8_layers/moe_everything_per_head_precompute_kv_perlayer_prenorm
  wandb_project: moe-scaling
  wandb_run_name: depth_matched_8_layers_moe_everything_per_head_precompute_kv_perlayer_prenorm

data:
  data_dir: ./data/parquet
  text_column: text
  seq_len: 1024
  tokenizer_name: Qwen/Qwen3-0.6B
  num_workers: 4

checkpoint:
  resume_from: null
