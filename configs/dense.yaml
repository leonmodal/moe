# XS scale — Qwen3-0.6B-style dense baseline.
# Matches standard_moe.yaml on depth / hidden / attention, but with a single
# dense MLP per layer (intermediate_size = 3072 = top-4 × 768 active MoE width).
# Use as the dense reference for parameter/loss comparison against the MoE
# variants that share this `configs/` root.
experiment_name: dense

model:
  type: dense
  vocab_size: 151936
  hidden_size: 1024
  num_hidden_layers: 16
  head_dim: 128
  num_attention_heads: 16           # 16 × 128 = 2048 attn dim (Qwen3-0.6B style)
  num_key_value_heads: 8            # GQA with 2 queries per KV head
  intermediate_size: 3072           # matches MoE active MLP width (top-4 × 768)
  attention_bias: false
  attention_dropout: 0.0
  rms_norm_eps: 1.0e-6
  rope_theta: 1000000.0
  max_position_embeddings: 32768
  tie_word_embeddings: true

training:
  learning_rate: 1.0e-3
  weight_decay: 0.01
  beta1: 0.9
  beta2: 0.95
  max_grad_norm: 1.0
  lr_scheduler: cosine
  warmup_steps: 1000
  max_steps: 100000
  min_lr_ratio: 0.1
  batch_size: 32
  gradient_accumulation: 2
  mixed_precision: bf16
  disable_liger: true
  gradient_checkpointing: false
  log_every: 1
  routing_log_every: 50
  save_every: 1000
  output_dir: ./outputs/dense
  wandb_project: moe-scaling
  wandb_run_name: dense

data:
  data_dir: ./data/parquet
  text_column: text
  seq_len: 1024
  tokenizer_name: Qwen/Qwen3-0.6B
  num_workers: 4

eval:
  enabled: true
  every: 250
  max_batches: 20
  holdout_fraction: 0.05
  seed: 1234

checkpoint:
  resume_from: null
