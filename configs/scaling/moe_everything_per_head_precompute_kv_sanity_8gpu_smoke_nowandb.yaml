# Real sanity schedule on 8 GPUs with W&B off, used for startup / OOM validation
experiment_name: moe_everything_per_head_precompute_kv_sanity_8gpu_smoke_nowandb

model:
  type: moe_everything
  vocab_size: 151936
  hidden_size: 1024
  num_hidden_layers: 32
  head_dim: 128
  num_attention_heads: 16
  num_key_value_heads: 8
  num_experts: 256
  num_experts_per_tok: 4
  moe_intermediate_size: 768
  intermediate_size: 3072
  norm_topk_prob: true
  branch_router_aux_loss_coef: 0.0
  router_aux_loss_coef: 0.0
  seq_aux_loss_coef: 0.0001
  bias_update_rate: 0.001
  bias_interpolation: true
  topk_scaling_factor: 2.5
  num_groups: 8
  group_topk: 4
  num_attn_experts: 256
  num_attn_experts_per_tok: 1
  attn_expert_mode: per_head_precompute_kv
  per_head_compute_mode: dense
  use_deepseek_routing: true
  per_layer_router: true
  per_layer_mlp_router: true
  per_layer_attn_router: true
  per_layer_norm: true
  sanity_check_mode: alternating_global_moe
  attention_bias: false
  attention_dropout: 0.0
  rms_norm_eps: 1.0e-6
  rope_theta: 1000000.0
  max_position_embeddings: 32768
  tie_word_embeddings: true
  output_router_logits: true

training:
  learning_rate: 1.0e-3
  weight_decay: 0.01
  beta1: 0.9
  beta2: 0.95
  max_grad_norm: 1.0
  lr_scheduler: cosine
  warmup_steps: 20
  max_steps: 20
  min_lr_ratio: 0.1
  batch_size: 32
  gradient_accumulation: 2
  mixed_precision: bf16
  gradient_checkpointing: true
  log_every: 1
  routing_log_every: 10
  save_every: 100000
  output_dir: ./outputs/moe_everything_per_head_precompute_kv_sanity_8gpu_smoke_nowandb
  wandb_project: null
  wandb_run_name: null

data:
  data_dir: ./data/parquet
  text_column: text
  seq_len: 1024
  tokenizer_name: Qwen/Qwen3-0.6B
  num_workers: 4

checkpoint:
  resume_from: null
