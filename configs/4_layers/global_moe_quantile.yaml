checkpoint:
  resume_from: null
data:
  data_dir: ./data/parquet
  num_workers: 4
  seq_len: 1024
  text_column: text
  tokenizer_name: Qwen/Qwen3-0.6B
eval:
  enabled: true
  every: 250
  holdout_fraction: 0.05
  max_batches: 20
  seed: 1234
experiment_name: 4_layers_global_moe_quantile
model:
  attention_bias: false
  attention_dropout: 0.0
  attn_router:
    balancing: none
  bias_interpolation: false
  branch_router:
    balancing: none
  global_router_update: true
  group_topk: 4
  head_dim: 128
  hidden_size: 1024
  intermediate_size: 3072
  max_position_embeddings: 32768
  mlp_router:
    balancing: quantile
    quantile_eta: 0.005
    quantile_target_q: 0.5
    quantile_global_state: true
  moe_intermediate_size: 768
  norm_topk_prob: true
  num_attention_heads: 16
  num_experts: 64
  num_experts_per_tok: 4
  num_groups: 8
  num_hidden_layers: 4
  num_key_value_heads: 8
  output_router_logits: true
  rms_norm_eps: 1.0e-06
  rope_theta: 1000000.0
  router_exploration_rate: 0.02
  router_type: deepseek
  tie_word_embeddings: true
  # DeepSeek-V3 paper Section 3.2 default 2.5
  topk_scaling_factor: 2.5
  type: global_moe
  vocab_size: 151936
training:
  batch_size: 32
  beta1: 0.9
  beta2: 0.95
  disable_liger: true
  gradient_accumulation: 2
  gradient_checkpointing: false
  learning_rate: 0.001
  log_every: 1
  lr_scheduler: cosine
  max_grad_norm: 1.0
  max_steps: 100000
  min_lr_ratio: 0.1
  mixed_precision: bf16
  output_dir: ./outputs/4_layers/global_moe_quantile
  routing_log_every: 50
  save_every: 1000
  wandb_project: moe-scaling
  wandb_run_name: 4_layers_global_moe_quantile
  warmup_steps: 1000
  weight_decay: 0.01
