experiment_name: baseline_standardmoe_1L_linearmap_30k

# Standard MoE baseline matched to MoE-Everything 1L active-param budget:
#   - normal attn (q+k+v+o, hidden=1024) ≈ 6.3M (no attn experts)
#   - MoE MLP: top-4 of 16 experts, moe_intermediate=768 ≈ 9.4M active
#   - 1 layer total (= 1 attn + 1 MoE-MLP per forward)
# Differs from MoE-Everything by: no attn routing, no branch routing.
# Same active params per token; total params higher than dense (16x mlp expert
# bank). We use deepseek_bias balancing to mirror the MoE-Everything's MLP
# router (no aux-loss coefficient noise).

model:
  type: standard_moe
  vocab_size: 2
  hidden_size: 1024
  num_hidden_layers: 1
  head_dim: 128
  num_attention_heads: 16
  num_key_value_heads: 8
  num_experts: 16
  num_experts_per_tok: 4
  moe_intermediate_size: 768
  intermediate_size: 3072
  norm_topk_prob: true
  router_exploration_rate: 0.02
  topk_scaling_factor: 2.5
  num_groups: 1
  group_topk: 1
  use_deepseek_routing: true
  global_router_update: true
  rms_norm_eps: 1.0e-06
  rope_theta: 1000000.0
  max_position_embeddings: 32768
  tie_word_embeddings: true
  mlp_router:
    balancing: deepseek_bias
    bias_update_rate: 0.001
    bias_update_zero_sum: true

training:
  learning_rate: 0.001
  weight_decay: 0.01
  beta1: 0.9
  beta2: 0.95
  max_grad_norm: 1.0
  lr_scheduler: cosine
  warmup_steps: 1500
  max_steps: 30000
  min_lr_ratio: 0.1
  batch_size: 64
  gradient_accumulation: 1
  mixed_precision: bf16
  disable_liger: true
  gradient_checkpointing: false
  log_every: 10
  routing_log_every: 50
  save_every: 1500
  output_dir: ./outputs/synthetic/baseline_standardmoe_1L_linearmap_30k
  wandb_project: moe-synthetic
  wandb_run_name: baseline_standardmoe_1L_linearmap_30k

data:
  format: synthetic_linear_map
  state_size: 16
  sparsity: 3
  trajectory_length: 2
  num_colors: 2
  task_seed: 0
  seed: 42
  num_workers: 0

eval:
  enabled: true
  every: 300
  max_batches: 8
  seed: 1234
  batch_size: 64

checkpoint:
  resume_from: null
