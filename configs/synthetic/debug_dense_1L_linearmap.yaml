experiment_name: debug_dense_1L_linearmap

# Sanity baseline: tiny dense 1-layer transformer on the linear-map task,
# matched as closely as possible to the paper's setup (Zhao et al. NeurIPS 2026
# §3.2): hidden 128, MLP 512, 8 heads, vocab=2, single layer. If THIS doesn't
# learn the task in 10k steps, the synthetic data/labels are broken. If it
# does, the MoE/branch routing in the 1L synthetic configs is the issue.

model:
  type: dense
  vocab_size: 2
  hidden_size: 128
  num_hidden_layers: 1
  head_dim: 16             # 128 / 8 heads = 16
  num_attention_heads: 8
  num_key_value_heads: 8   # no GQA in the paper's baseline
  intermediate_size: 512
  rms_norm_eps: 1.0e-06
  rope_theta: 1000000.0
  max_position_embeddings: 32768
  tie_word_embeddings: true

training:
  learning_rate: 0.001
  weight_decay: 0.01
  beta1: 0.9
  beta2: 0.95
  max_grad_norm: 1.0
  lr_scheduler: cosine
  warmup_steps: 500
  max_steps: 10000
  min_lr_ratio: 0.1
  batch_size: 64
  gradient_accumulation: 1
  mixed_precision: bf16
  disable_liger: true
  gradient_checkpointing: false
  log_every: 10
  save_every: 500
  output_dir: ./outputs/synthetic/debug_dense_1L_linearmap
  wandb_project: moe-synthetic
  wandb_run_name: debug_dense_1L_linearmap

data:
  format: synthetic_linear_map
  state_size: 16
  sparsity: 3
  trajectory_length: 2
  num_colors: 2
  task_seed: 0
  seed: 42
  num_workers: 0

eval:
  enabled: true
  every: 100
  max_batches: 8
  seed: 1234
  batch_size: 64

checkpoint:
  resume_from: null
