experiment_name: 4L_cellular_localbank_FA_recomputeKV_qkvo

# Sweep variant: attn_expert_mode={MODE}, attn_routing_bundle={BUNDLE}.
# All other settings match the local-bank fixed_alternating 4L config.

model:
  type: moe_everything
  vocab_size: 4
  hidden_size: 1024
  num_hidden_layers: 8
  head_dim: 128
  num_attention_heads: 16
  num_key_value_heads: 8
  num_experts: 16
  num_experts_per_tok: 4
  moe_intermediate_size: 768
  intermediate_size: 3072
  norm_topk_prob: true
  router_exploration_rate: 0.02
  bias_interpolation: false
  topk_scaling_factor: 2.5
  num_groups: 1
  group_topk: 1
  num_attn_experts: 8
  num_attn_experts_per_tok: 1
  attn_expert_mode: per_head_recompute_kv
  attn_routing_bundle: qkvo
  per_layer_router: true
  per_layer_mlp_router: true
  per_layer_attn_router: true
  per_layer_expert_bank: true
  per_layer_norm: true
  per_layer_qk_norm: true
  scale_attn_by_routing_weight: true
  scale_branch_by_routing_weight: true
  use_deepseek_routing: true
  global_router_update: true
  attention_bias: false
  attention_dropout: 0.0
  rms_norm_eps: 1.0e-06
  rope_theta: 1000000.0
  max_position_embeddings: 32768
  tie_word_embeddings: true
  output_router_logits: true
  mlp_router:
    balancing: deepseek_bias
    bias_update_rate: 0.001
    bias_update_zero_sum: true
  attn_router:
    balancing: deepseek_bias
    bias_update_rate: 0.001
    bias_update_zero_sum: true
  branch_router:
    balancing: fixed_alternating

training:
  learning_rate: 0.001
  weight_decay: 0.01
  beta1: 0.9
  beta2: 0.95
  max_grad_norm: 1.0
  lr_scheduler: cosine
  warmup_steps: 500
  max_steps: 10000
  min_lr_ratio: 0.1
  batch_size: 32
  gradient_accumulation: 1
  mixed_precision: bf16
  disable_liger: true
  gradient_checkpointing: false
  log_every: 10
  routing_log_every: 50
  save_every: 500
  output_dir: ./outputs/synthetic/4L_cellular_localbank_FA_recomputeKV_qkvo
  wandb_project: moe-synthetic
  wandb_run_name: 4L_cellular_localbank_FA_recomputeKV_qkvo

data:
  format: synthetic_cellular_automata
  state_size: 16
  trajectory_length: 16
  num_colors: 4
  num_rules: 256
  recursive_depth: 1
  task_seed: 0
  seed: 42
  num_workers: 0

eval:
  enabled: true
  every: 100
  max_batches: 8
  seed: 1234
  batch_size: 32

checkpoint:
  resume_from: null
