# ============================================================================
# Sanity / control variant — DETERMINISTIC alternating attention / MLP depths.
# `sanity_check_mode: alternating_global_moe` disables the learned branch
# router: even depths do attention, odd depths do MLP. The other
# moe_everything machinery (precompute-KV per-head Q/O attention experts,
# 64 banked MLP experts, per-layer MLP router and norm) stays on.
#
# Used as a baseline to isolate the effect of the LEARNED branch decision in
# the other moe_everything configs — if a learned-router run can't beat this
# deterministic baseline, the branch router isn't earning its keep.
# ============================================================================
experiment_name: 16_layers_moe_everything_per_head_precompute_kv_sanity

model:
  type: moe_everything
  vocab_size: 151936
  hidden_size: 1024
  num_hidden_layers: 32
  head_dim: 128
  num_attention_heads: 16
  num_key_value_heads: 8
  num_experts: 256
  num_experts_per_tok: 4
  moe_intermediate_size: 768
  intermediate_size: 3072
  norm_topk_prob: true
  branch_router_aux_loss_coef: 0.0
  router_aux_loss_coef: 0.001
  seq_aux_loss_coef: 0.0001
  router_exploration_rate: 0.02
  bias_update_rate: 0.001
  bias_interpolation: false
  global_router_update: true
  topk_scaling_factor: 2.5
  num_groups: 8
  group_topk: 4
  num_attn_experts: 128
  num_attn_experts_per_tok: 1
  attn_expert_mode: per_head_precompute_kv
  scale_attn_by_routing_weight: true
  scale_branch_by_routing_weight: true
  per_head_compute_mode: dense
  use_deepseek_routing: true
  per_layer_mlp_router: true
  per_layer_norm: true
  sanity_check_mode: alternating_global_moe
  attention_bias: false
  attention_dropout: 0.0
  rms_norm_eps: 1.0e-6
  rope_theta: 1000000.0
  max_position_embeddings: 32768
  tie_word_embeddings: true
  output_router_logits: true
  load_balancing_method: aux_loss  # aux_loss | seq_aux_loss | deepseek_bias | quantile | none

training:
  learning_rate: 1.0e-3
  weight_decay: 0.01
  beta1: 0.9
  beta2: 0.95
  max_grad_norm: 1.0
  lr_scheduler: cosine
  warmup_steps: 1000
  max_steps: 100000
  min_lr_ratio: 0.1
  batch_size: 32
  gradient_accumulation: 2
  mixed_precision: bf16
  disable_liger: true
  gradient_checkpointing: false
  log_every: 1
  routing_log_every: 50
  save_every: 1000
  output_dir: ./outputs/16_layers/moe_everything_per_head_precompute_kv_sanity
  wandb_project: moe-scaling
  wandb_run_name: 16_layers_moe_everything_per_head_precompute_kv_sanity

data:
  data_dir: ./data/parquet
  text_column: text
  seq_len: 1024
  tokenizer_name: Qwen/Qwen3-0.6B
  num_workers: 4

eval:
  enabled: true
  every: 250
  max_batches: 20
  holdout_fraction: 0.05
  seed: 1234

initialization:
  strategy: global_to_alternating_sanity
  source_config: global_moe.yaml

checkpoint:
  resume_from: null
