experiment_name: 16_layers_moe_everything_per_head_recompute_kv_qkvo_deepseek_bias

model:
  type: moe_everything
  vocab_size: 151936
  hidden_size: 1024
  num_hidden_layers: 16
  head_dim: 128
  num_attention_heads: 16
  num_key_value_heads: 8
  num_experts: 256
  num_experts_per_tok: 4
  moe_intermediate_size: 768
  intermediate_size: 3072
  norm_topk_prob: true
  router_exploration_rate: 0.02
  bias_interpolation: false
  topk_scaling_factor: 2.5
  num_groups: 8
  group_topk: 4
  num_attn_experts: 128
  num_attn_experts_per_tok: 1
  attn_expert_mode: per_head_recompute_kv
  attn_routing_bundle: qkvo
  per_layer_router: true
  per_layer_mlp_router: true
  per_layer_attn_router: true
  per_layer_norm: true
  per_layer_qk_norm: true
  scale_attn_by_routing_weight: true
  scale_branch_by_routing_weight: true
  use_deepseek_routing: true
  global_router_update: true
  attention_bias: false
  attention_dropout: 0.0
  rms_norm_eps: 1.0e-06
  rope_theta: 1000000.0
  max_position_embeddings: 32768
  tie_word_embeddings: true
  output_router_logits: true
  mlp_router:
    balancing: deepseek_bias
    bias_update_rate: 0.001
    bias_update_zero_sum: true
  attn_router:
    balancing: deepseek_bias
    bias_update_rate: 0.001
    bias_update_zero_sum: true
  branch_router:
    balancing: sampling_entropy
    entropy_coef: 0.01
    entropy_decay: cosine
    entropy_min: 0.0
    entropy_decay_steps: 1000

training:
  learning_rate: 0.001
  weight_decay: 0.01
  beta1: 0.9
  beta2: 0.95
  max_grad_norm: 1.0
  lr_scheduler: cosine
  warmup_steps: 1000
  max_steps: 100000
  min_lr_ratio: 0.1
  batch_size: 16
  gradient_accumulation: 1
  mixed_precision: bf16
  disable_liger: true
  gradient_checkpointing: true
  log_every: 1
  routing_log_every: 50
  save_every: 1000
  output_dir: ./outputs/16_layers/moe_everything_per_head_recompute_kv_qkvo_deepseek_bias
  wandb_project: moe-scaling
  wandb_run_name: 16_layers_moe_everything_per_head_recompute_kv_qkvo_deepseek_bias

data:
  data_dir: ./data/parquet
  text_column: text
  seq_len: 1024
  tokenizer_name: Qwen/Qwen3-0.6B
  num_workers: 4

eval:
  enabled: true
  every: 250
  max_batches: 20
  holdout_fraction: 0.05
  seed: 1234

checkpoint:
  resume_from: null
