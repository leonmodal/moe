# XS scale — Qwen3-0.6B backbone, MoE-Everything with kv_paired attention routing
# 32 shared depth iterations, 16 attn experts, 256 MLP experts, top-4
# DeepSeek V3 routing: sigmoid + expert bias + sequence-level aux loss
experiment_name: moe_everything_kv_paired

model:
  type: moe_everything
  vocab_size: 151936
  hidden_size: 1024
  num_hidden_layers: 32             # depth iterations (all weights shared)
  head_dim: 128
  num_attention_heads: 16           # 16 × 128 = 2048 attn dim
  num_key_value_heads: 8            # GQA with 2 queries per KV head
  # ── MLP experts (16 equiv layers × 16 per layer = 256 pool) ───────────────
  num_experts: 256
  num_experts_per_tok: 4            # top-4; active FFN = 4 × 768 = 3072
  moe_intermediate_size: 768
  intermediate_size: 3072
  norm_topk_prob: true
  router_aux_loss_coef: 0.0         # no batch-level aux loss
  seq_aux_loss_coef: 0.0001         # sequence-level aux loss (DeepSeek V3: α=0.0001)
  bias_update_rate: 0.001           # expert bias update rate (DeepSeek V3)
  topk_scaling_factor: 2.5          # routing weight scaling (DeepSeek V3)
  num_groups: 8                     # group-limited routing: num expert groups
  group_topk: 4                     # group-limited routing: groups selected per token
  # ── Attention experts (16 equiv layers × 1 per layer = 16 pool) ─────────
  num_attn_experts: 16
  num_attn_experts_per_tok: 1
  attn_expert_mode: kv_paired         # bundled | kv_paired | qk_paired | fully_independent | precompute_kv
  # ── Routing ──────────────────────────────────────────────────────────────
  use_deepseek_routing: true
  branch_router_aux_loss_coef: 0.01
  # ── Misc ─────────────────────────────────────────────────────────────────
  attention_bias: false
  attention_dropout: 0.0
  rms_norm_eps: 1.0e-6
  rope_theta: 1000000.0
  max_position_embeddings: 32768
  tie_word_embeddings: true
  output_router_logits: true

training:
  learning_rate: 1.0e-3
  weight_decay: 0.01
  beta1: 0.9
  beta2: 0.95
  max_grad_norm: 1.0
  lr_scheduler: cosine
  warmup_steps: 1000
  max_steps: 100000
  min_lr_ratio: 0.1
  batch_size: 32
  gradient_accumulation: 2
  mixed_precision: bf16
  gradient_checkpointing: true
  log_every: 1
  routing_log_every: 50
  save_every: 1000
  output_dir: ./outputs/moe_everything_kv_paired
  wandb_project: moe-scaling
  wandb_run_name: moe_everything_kv_paired

data:
  data_dir: ./data/parquet
  text_column: text
  seq_len: 1024
  tokenizer_name: Qwen/Qwen3-0.6B
  num_workers: 4

checkpoint:
  resume_from: null
