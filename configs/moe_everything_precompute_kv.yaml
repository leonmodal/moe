# Mixture-of-Everything (Section 4.1)
# Each token at each depth routes to ATTENTION or MLP, then selects experts.
# attn_expert_mode: precompute_kv | qo_kv_paired | qk_paired | fully_independent | precompute_kv
experiment_name: moe_everything_precompute_kv

model:
  type: moe_everything
  vocab_size: 151936
  hidden_size: 1024
  num_hidden_layers: 32           # 32 depths ≈ 16 standard layers (each depth is ATTN or MLP, not both)
  head_dim: 128
  num_attention_heads: 16
  num_key_value_heads: 8
  # ── MLP experts ────────────────────────────────────────────────────────────
  num_experts: 16
  num_experts_per_tok: 4
  moe_intermediate_size: 768
  intermediate_size: 3072
  norm_topk_prob: true
  router_aux_loss_coef: 0.01
  # ── Attention experts ──────────────────────────────────────────────────────
  num_attn_experts: 4
  num_attn_experts_per_tok: 1
  attn_expert_mode: precompute_kv          # bundled | qo_kv_paired | fully_independent | precompute_kv
  # ── Branch router ──────────────────────────────────────────────────────────
  branch_router_aux_loss_coef: 0.01
  # ── Misc ───────────────────────────────────────────────────────────────────
  attention_bias: false
  attention_dropout: 0.0
  rms_norm_eps: 1.0e-6
  rope_theta: 1000000.0
  max_position_embeddings: 32768
  tie_word_embeddings: true
  output_router_logits: true

training:
  learning_rate: 1.0e-3
  weight_decay: 0.01
  beta1: 0.9
  beta2: 0.95
  max_grad_norm: 1.0
  lr_scheduler: cosine
  warmup_steps: 1000
  max_steps: 1000000
  min_lr_ratio: 0.1
  batch_size: 64
  gradient_accumulation: 1
  mixed_precision: bf16
  gradient_checkpointing: false
  log_every: 1
  routing_log_every: 50
  save_every: 5000
  output_dir: ./outputs/moe_everything_precompute_kv
  wandb_project: moe-scaling
  wandb_run_name: moe_everything_precompute_kv

data:
  data_dir: ./data/parquet
  text_column: text
  seq_len: 1024
  tokenizer_name: Qwen/Qwen3-0.6B
  num_workers: 4

checkpoint:
  resume_from: null
