# GPT-2-small baseline on official cached FineWeb GPT-2 token bins.
experiment_name: gpt2_small_fineweb10b_gpt2_bins

model:
  type: gpt2_dense
  vocab_size: 50257
  hidden_size: 768
  num_hidden_layers: 12
  head_dim: 64
  num_attention_heads: 12
  num_key_value_heads: 12
  intermediate_size: 3072
  max_position_embeddings: 1024
  attention_dropout: 0.0
  resid_pdrop: 0.0
  embd_pdrop: 0.0
  layer_norm_epsilon: 1.0e-5
  tie_word_embeddings: true

training:
  learning_rate: 6.0e-4
  weight_decay: 0.01
  beta1: 0.9
  beta2: 0.95
  max_grad_norm: 1.0
  lr_scheduler: cosine
  warmup_steps: 100
  max_steps: 800
  min_lr_ratio: 0.1
  batch_size: 32
  gradient_accumulation: 2
  mixed_precision: bf16
  disable_liger: true
  gradient_checkpointing: false
  log_every: 1
  routing_log_every: 250
  save_every: 200
  output_dir: ./outputs/plan/gpt2_small_fineweb10b_gpt2_bins
  wandb_project: null
  wandb_run_name: null

data:
  format: token_bin
  files_glob: ./data/fineweb10B_gpt2/fineweb_train_*.bin
  seq_len: 1024
  header_bytes: 1024
  token_dtype: uint16
  shuffle_files: false
  repeat: false

eval:
  enabled: true
  every: 200
  max_batches: 0
  format: token_bin
  files_glob: ./data/fineweb10B_gpt2/fineweb_val_*.bin
  max_tokens: 10485760
  seq_len: 1024
  batch_size: 32

checkpoint:
  resume_from: null
