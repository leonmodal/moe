# Dense Qwen3-0.6B-style baseline on official cached FineWeb GPT-2 token bins.
experiment_name: qwen3_0_6b_fineweb10b_gpt2_bins

model:
  type: dense
  vocab_size: 50257
  hidden_size: 1024
  num_hidden_layers: 28
  head_dim: 128
  num_attention_heads: 16
  num_key_value_heads: 8
  intermediate_size: 3072
  attention_bias: false
  attention_dropout: 0.0
  rms_norm_eps: 1.0e-6
  rope_theta: 1000000.0
  max_position_embeddings: 1024
  tie_word_embeddings: true

training:
  learning_rate: 1.0e-3
  weight_decay: 0.01
  beta1: 0.9
  beta2: 0.95
  max_grad_norm: 1.0
  lr_scheduler: cosine
  warmup_steps: 100
  max_steps: 800
  min_lr_ratio: 0.1
  batch_size: 32
  gradient_accumulation: 2
  mixed_precision: bf16
  disable_liger: true
  gradient_checkpointing: false
  log_every: 1
  routing_log_every: 250
  save_every: 200
  output_dir: ./outputs/plan/qwen3_0_6b_fineweb10b_gpt2_bins
  wandb_project: null
  wandb_run_name: null

data:
  format: token_bin
  files_glob: ./data/fineweb10B_gpt2/fineweb_train_*.bin
  seq_len: 1024
  header_bytes: 1024
  token_dtype: uint16
  shuffle_files: false
  repeat: false

eval:
  enabled: true
  every: 200
  max_batches: 0
  format: token_bin
  files_glob: ./data/fineweb10B_gpt2/fineweb_val_*.bin
  max_tokens: 10485760
  seq_len: 1024
  batch_size: 32

checkpoint:
  resume_from: null
