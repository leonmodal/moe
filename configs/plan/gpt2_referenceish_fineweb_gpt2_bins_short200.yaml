# Short discriminator run: GPT-2 dense geometry pushed closer to modded-nanogpt.
experiment_name: gpt2_referenceish_fineweb_gpt2_bins_short200

model:
  type: gpt2_dense
  vocab_size: 50257
  hidden_size: 768
  num_hidden_layers: 12
  head_dim: 128
  num_attention_heads: 6
  num_key_value_heads: 6
  intermediate_size: 3072
  max_position_embeddings: 1024
  attention_dropout: 0.0
  resid_pdrop: 0.0
  embd_pdrop: 0.0
  layer_norm_epsilon: 1.0e-5
  tie_word_embeddings: true

training:
  optimizer: muon
  muon_lr: 0.05
  muon_weight_decay: 0.0
  adam_lr: 0.008
  momentum_warmup_steps: 0
  learning_rate: 0.05
  weight_decay: 0.0
  beta1: 0.8
  beta2: 0.95
  eps: 1.0e-10
  max_grad_norm: 1.0
  lr_scheduler: constant
  warmup_steps: 0
  max_steps: 200
  min_lr_ratio: 1.0
  batch_size: 64
  gradient_accumulation: 1
  mixed_precision: bf16
  disable_liger: true
  gradient_checkpointing: false
  log_every: 1
  routing_log_every: 250
  save_every: 200
  output_dir: ./outputs/plan/gpt2_referenceish_fineweb_gpt2_bins_short200
  wandb_project: null
  wandb_run_name: null

data:
  format: token_bin
  files_glob: ./data/fineweb10B_gpt2/fineweb_train_*.bin
  seq_len: 1024
  header_bytes: 1024
  token_dtype: uint16
  shuffle_files: false
  repeat: false

eval:
  enabled: true
  every: 200
  max_batches: 0
  format: token_bin
  files_glob: ./data/fineweb10B_gpt2/fineweb_val_*.bin
  max_tokens: 10485760
  seq_len: 1024
  batch_size: 64
  repeat: false

checkpoint:
  resume_from: null
