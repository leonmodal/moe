# Depth-matched alternating attention/MLP sanity config.
# Logical depth = 4 global-style layers, represented as 8 alternating depths.
# MLP expert pool = 4 x 16 = 64 experts.
# Attention expert pool = 4 x 8 KV groups = 32 grouped attention experts.
experiment_name: depth_matched_fp32_no_liger_4_layers_moe_everything_per_head_precompute_kv_sanity

model:
  type: moe_everything
  vocab_size: 151936
  hidden_size: 1024
  num_hidden_layers: 8
  head_dim: 128
  num_attention_heads: 16
  num_key_value_heads: 8
  num_experts: 64
  num_experts_per_tok: 4
  moe_intermediate_size: 768
  intermediate_size: 3072
  norm_topk_prob: true
  branch_router_aux_loss_coef: 0.0
  router_aux_loss_coef: 0.0
  seq_aux_loss_coef: 0.0001
  bias_update_rate: 0.001
  bias_interpolation: false
  global_router_update: true
  topk_scaling_factor: 2.5
  num_groups: 8
  group_topk: 4
  num_attn_experts: 32
  num_attn_experts_per_tok: 1
  attn_expert_mode: per_head_precompute_kv
  scale_attn_by_routing_weight: false
  per_head_compute_mode: dense
  use_deepseek_routing: true
  per_layer_mlp_router: true
  per_layer_norm: true
  per_layer_qk_norm: true
  sanity_check_mode: alternating_global_moe
  attention_bias: false
  attention_dropout: 0.0
  rms_norm_eps: 1.0e-6
  rope_theta: 1000000.0
  max_position_embeddings: 32768
  tie_word_embeddings: true
  output_router_logits: true

training:
  learning_rate: 1.0e-3
  weight_decay: 0.01
  beta1: 0.9
  beta2: 0.95
  max_grad_norm: 1.0
  lr_scheduler: cosine
  warmup_steps: 1000
  max_steps: 100000
  min_lr_ratio: 0.1
  batch_size: 32
  gradient_accumulation: 2
  mixed_precision: fp32
  disable_liger: true
  gradient_checkpointing: false
  log_every: 1
  routing_log_every: 50
  save_every: 1000
  output_dir: ./outputs/depth_matched_fp32_no_liger/4_layers/moe_everything_per_head_precompute_kv_sanity
  wandb_project: moe-scaling
  wandb_run_name: depth_matched_fp32_no_liger_4_layers_moe_everything_per_head_precompute_kv_sanity

data:
  data_dir: ./data/parquet
  text_column: text
  seq_len: 1024
  tokenizer_name: Qwen/Qwen3-0.6B
  num_workers: 4

initialization:
  strategy: global_to_alternating_sanity
  source_config: global_moe.yaml

checkpoint:
  resume_from: null
