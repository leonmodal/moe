# ============================================================================
# MoE-Everything — mixture of experts on EVERYTHING (attention heads, MLP,
# and the attn-vs-MLP branch decision). Single shared bank of weights reused
# across `num_hidden_layers` depth iterations (the file's "N layers" expands
# to 2N depth iters, weights constant, activations grow with depth).
#
# Per token at each depth:
#   1. Branch router → ATTN or MLP (binary, hard).
#   2. If ATTN, `attn_expert_mode: per_head_fully_independent` — Q, K, V, O
#      each have their own pool of `num_attn_experts=32` experts; each head
#      picks 1 expert per projection independently.
#   3. If MLP, top-4 of 64 banked experts (group-limited: 8 groups, 4 selected).
#
# No per-layer routers or norms — bank, branch router, and norms are global.
# ============================================================================
experiment_name: 8_layers_moe_everything_per_head_fully_independent

model:
  type: moe_everything
  vocab_size: 151936
  hidden_size: 1024
  num_hidden_layers: 16
  head_dim: 128
  num_attention_heads: 16
  num_key_value_heads: 8
  num_experts: 128
  num_experts_per_tok: 4
  moe_intermediate_size: 768
  intermediate_size: 3072
  norm_topk_prob: true
  branch_router_aux_loss_coef: 0.0
  router_aux_loss_coef: 0.001
  seq_aux_loss_coef: 0.0001
  router_exploration_rate: 0.02
  bias_update_rate: 0.001
  bias_interpolation: false
  topk_scaling_factor: 2.5
  num_groups: 8
  group_topk: 4
  num_attn_experts: 64
  num_attn_experts_per_tok: 1
  attn_expert_mode: per_head_fully_independent
  scale_attn_by_routing_weight: true
  scale_branch_by_routing_weight: true
  per_head_compute_mode: dense
  use_deepseek_routing: true
  global_router_update: true
  attention_bias: false
  attention_dropout: 0.0
  rms_norm_eps: 1.0e-6
  rope_theta: 1000000.0
  max_position_embeddings: 32768
  tie_word_embeddings: true
  output_router_logits: true
  load_balancing_method: aux_loss  # aux_loss | seq_aux_loss | deepseek_bias | quantile | none

training:
  learning_rate: 1.0e-3
  weight_decay: 0.01
  beta1: 0.9
  beta2: 0.95
  max_grad_norm: 1.0
  lr_scheduler: cosine
  warmup_steps: 1000
  max_steps: 100000
  min_lr_ratio: 0.1
  batch_size: 32
  gradient_accumulation: 2
  mixed_precision: bf16
  disable_liger: true
  gradient_checkpointing: true
  log_every: 1
  routing_log_every: 50
  save_every: 1000
  output_dir: ./outputs/8_layers/moe_everything_per_head_fully_independent
  wandb_project: moe-scaling
  wandb_run_name: 8_layers_moe_everything_per_head_fully_independent

data:
  data_dir: ./data/parquet
  text_column: text
  seq_len: 1024
  tokenizer_name: Qwen/Qwen3-0.6B
  num_workers: 4

eval:
  enabled: true
  every: 250
  max_batches: 20
  holdout_fraction: 0.05
  seed: 1234

checkpoint:
  resume_from: null
